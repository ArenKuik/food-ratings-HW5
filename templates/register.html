{% extends "base.html" %}
{% block title %}Register · Rate the Food{% endblock %}
{% block content %}
<h1>Create an account</h1>
<form class="auth" method="post">
  {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
  <label>Username
    <input name="username" value="{{ username }}" required autofocus>
    <span class="muted">3–20 characters: letters, numbers, underscores</span>
  </label>
  <label>Password
    <input name="password" type="password" required>
    <span class="muted">At least 6 characters</span>
  </label>
  <label>Confirm password
    <input name="confirm" type="password" required>
  </label>
  <button type="submit">Register</button>
</form>
<p class="muted">Already have an account? <a href="{{ url_for('login', next=next) }}">Log in</a></p>
{% endblock %}
