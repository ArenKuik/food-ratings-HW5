{% extends "base.html" %}
{% block title %}Review {{ place.name }} · Rate the Food{% endblock %}
{% block content %}
<p><a href="{{ url_for('place', place_id=place.id) }}">← Back to {{ place.name }}</a></p>

<h1>{{ "Edit your review" if editing else "Review" }} of {{ place.name }}</h1>
<form class="review" method="post">
  <fieldset class="star-pick">
    <legend>Rating</legend>
    {% for n in range(1, 6) %}
      <label><input type="radio" name="rating" value="{{ n }}" required
             {{ "checked" if rating == n }}> <span class="stars">{{ "★" * n }}</span></label>
    {% endfor %}
  </fieldset>
  <label>Your review
    <textarea name="text" rows="5" maxlength="{{ max_length }}" required>{{ text }}</textarea>
  </label>
  <button type="submit">{{ "Save changes" if editing else "Post review" }}</button>
</form>
{% endblock %}
